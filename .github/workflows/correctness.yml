name: correctness

on:
  push:
  pull_request:

jobs:
  llvm-independent-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LLVM-independent regression suite
        run: g++ -std=c++20 -Icompiler tests/ir_tests.cpp -o nano_ir_tests
      - name: Run IR, interpreter, differential, and seeded fuzz regressions
        run: ./nano_ir_tests
      - name: Build correctness command-line tool
        run: g++ -std=c++20 -Icompiler tools/nano-correctness.cpp -o nano-correctness
      - name: Run bounded deterministic fuzz smoke
        run: ./nano-correctness fuzz 42 32
